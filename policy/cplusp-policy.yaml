# cplusp-policy.yaml: the rule list. One entry per row of the subset table in docs/plan.md.
# The gate reads this file. `cplusp policy doc` generates the plan's table from it.
version: 1

defaults:
  new_functions: verified
  edited_functions: keep
  exceptions:
    reason_required: true
    approval: report

rules:
  # ---------------------------------------------------------------- types
  - id: fixed_width_ints
    construct: Fixed-width ints, `bool`, `enum class`
    area: types
    canonical: MISRA prefers sized types and scoped enums
    decision: allow
    why: Easy for the prover.
    stage: none

  - id: plain_int
    construct: Plain `int`, `long`, `short`, `char` and the other built-in integer types
    area: types
    canonical: "MISRA Dir 4.6: use typedefs that show size and signedness"
    decision: ban
    why: The compiler sets the width and the signedness of these types. The source does not say them, and the proof needs them.
    use_instead: "int32_t, uint8_t and the other fixed-width types from <cstdint>, bool, and size_t for sizes."
    stage: gate
    detect:
      - matcher: typeLoc(loc(qualType(builtinType(), isInteger(), unless(qualType(booleanType())))))

  - id: unscoped_enum
    construct: Unscoped `enum`
    area: types
    canonical: "MISRA: use scoped"
    decision: ban
    why: Implicit int conversion.
    use_instead: enum class.
    stage: gate
    detect:
      - matcher: enumDecl(unless(isScoped()), unless(isImplicit()))

  - id: double
    construct: "`double`"
    area: types
    canonical: Allowed by all
    decision: restrict
    limit: Finite values only, stated in the contract. A contract gives an error bound, never an equality. One operation per expression.
    why: The model is a real after one rounding per operation, with the error bound of IEEE 754 binary64 as an axiom. It has no NaN and no infinity, so the contract must keep them out.
    stage: prover

  - id: double_only
    construct: "`float` and `long double`"
    area: types
    canonical: "Allowed by all. Our model is of one type"
    decision: trusted_only
    why: The model is of IEEE 754 binary64. A float or a long double would prove against bounds that are not its own.
    use_instead: "double. Trusted code converts a float from outside at the edge."
    stage: gate
    detect:
      - matcher: typeLoc(loc(qualType(realFloatingPointType(), unless(hasCanonicalType(anyOf(asString("double"), asString("const double")))))))

  - id: unions
    construct: Unions
    area: types
    canonical: Banned by MISRA and Core Guidelines
    decision: ban
    why: Type punning breaks the memory model.
    use_instead: std::variant.
    stage: gate
    detect:
      - check: cppcoreguidelines-pro-type-union-access
      - matcher: recordDecl(isUnion(), isDefinition())

  - id: bitfields
    construct: Bit-fields
    area: types
    canonical: MISRA advisory ban
    decision: trusted_only
    why: Layout is implementation-defined.
    use_instead: explicit masks and shifts, or mark the function trusted with a reason.
    stage: gate
    detect:
      - matcher: fieldDecl(isBitField())

  - id: uninitialised_variables
    construct: Uninitialised variables
    area: types
    canonical: MISRA and Core Guidelines ban
    decision: ban
    why: Reading them is UB.
    use_instead: an initialiser on every declaration.
    stage: gate
    detect:
      - check: cppcoreguidelines-init-variables
      - check: cppcoreguidelines-pro-type-member-init

  # ----------------------------------------------------------- arithmetic
  - id: arithmetic
    construct: Signed/unsigned arithmetic, shifts, division
    area: arithmetic
    canonical: Allowed with care
    decision: allow
    why: The prover proves no overflow, bad shift or divide by zero.
    stage: prover

  - id: sign_compare
    construct: Comparison of a signed with an unsigned integer
    area: arithmetic
    canonical: "MISRA 10.4, -Wsign-compare"
    decision: ban
    why: The signed operand converts to unsigned, so a negative value compares as a large one.
    use_instead: "std::cmp_less and its siblings from <utility>, or a test of the sign and then a static_cast."
    stage: gate
    detect:
      - matcher: binaryOperator(isComparisonOperator(), hasEitherOperand(implicitCastExpr(hasType(isUnsignedInteger()), hasSourceExpression(hasType(isSignedInteger())), unless(hasSourceExpression(ignoringImplicit(integerLiteral()))))))

  - id: implicit_narrowing
    construct: Implicit narrowing conversion
    area: arithmetic
    canonical: "Core Guidelines ES.46"
    decision: ban
    why: The value changes with no sign in the source. C++20 wraps an integer, and a double loses its fraction.
    use_instead: "a static_cast with a contract that the value fits, or a wider type."
    stage: gate
    detect:
      - check: cppcoreguidelines-narrowing-conversions
        options:
          WarnWithinTemplateInstantiation: "true"
      - matcher: 'implicitCastExpr(hasType(hasCanonicalType(anyOf(asString("unsigned char"), asString("unsigned short")))), hasSourceExpression(hasType(hasCanonicalType(asString("int")))), unless(hasSourceExpression(ignoringImplicit(integerLiteral()))), unless(hasParent(explicitCastExpr())))'
      - matcher: 'binaryOperator(isAssignmentOperator(), unless(hasOperatorName("=")), hasLHS(hasType(hasCanonicalType(anyOf(asString("unsigned char"), asString("unsigned short"), asString("signed char"), asString("short"))))))'

  - id: sign_conversion
    construct: Implicit conversion of a signed integer to unsigned
    area: arithmetic
    canonical: "MISRA 10.3, -Wsign-conversion"
    decision: ban
    why: A negative value becomes a large one with no sign in the source.
    use_instead: "a test of the sign in the contract and then a static_cast."
    stage: gate
    detect:
      - matcher: 'implicitCastExpr(hasType(isUnsignedInteger()), unless(hasType(hasCanonicalType(anyOf(asString("unsigned char"), asString("unsigned short"))))), unless(hasType(booleanType())), hasSourceExpression(hasType(isSignedInteger())), unless(hasSourceExpression(ignoringImplicit(integerLiteral()))), unless(hasParent(binaryOperator(isComparisonOperator()))), unless(hasParent(explicitCastExpr())))'

  - id: widening_multiplication
    construct: Multiplication in a narrow type whose result widens
    area: arithmetic
    canonical: "Core Guidelines ES.103"
    decision: ban
    why: The product overflows in the narrow type before it reaches the wide one.
    use_instead: "a wide operand first, such as int64_t{a} * b."
    stage: gate
    detect:
      - check: bugprone-implicit-widening-of-multiplication-result

  - id: literal_shift
    construct: Shift of a literal of type int
    area: arithmetic
    canonical: "MISRA 12.2"
    decision: ban
    why: The literal is an int, so the shift is 32 bits wide whatever the destination type.
    use_instead: "a literal of the destination type, such as uint64_t{1} << n."
    stage: gate
    detect:
      - matcher: 'binaryOperator(hasOperatorName("<<"), hasLHS(ignoringImpCasts(integerLiteral(hasType(asString("int"))))))'

  - id: double_equality
    construct: "`==` or `!=` on `double` values"
    area: arithmetic
    canonical: "MISRA 2023 and Core Guidelines warn, -Wfloat-equal"
    decision: ban
    why: Two computations of one value differ in the last bit, so equality is not a fact the model can state.
    use_instead: "a comparison against a tolerance, written in the contract as an error bound."
    stage: gate
    detect:
      - matcher: binaryOperator(hasAnyOperatorName("==", "!="), hasLHS(hasType(realFloatingPointType())))

  - id: rounding_mode
    construct: A call that changes the floating-point rounding mode or control register
    area: arithmetic
    canonical: "MISRA 2023 bans <cfenv> writes"
    decision: ban
    why: The double model assumes round to nearest even for every operation in the process.
    use_instead: "nothing. Verified code reads the mode at most."
    stage: gate
    detect:
      - matcher: callExpr(callee(functionDecl(hasAnyName("::fesetround", "::std::fesetround", "::fesetenv", "::std::fesetenv", "::feupdateenv", "::std::feupdateenv", "::_mm_setcsr", "::__builtin_ia32_ldmxcsr"))))

  - id: double_expression
    construct: Two `double` operations in one expression
    area: arithmetic
    canonical: "-ffp-contract, MISRA advisory"
    decision: restrict
    limit: One `double` operation per expression. A comparison compares values, not results of arithmetic.
    why: The compiler may fuse two operations into one rounding, and the model rounds once per operation.
    use_instead: "a named local for each intermediate result."
    stage: gate
    detect:
      - matcher: binaryOperator(hasType(realFloatingPointType()), unless(hasOperatorName("=")), hasEitherOperand(anyOf(binaryOperator(hasType(realFloatingPointType())), hasDescendant(binaryOperator(hasType(realFloatingPointType()))))))
      - matcher: binaryOperator(isComparisonOperator(), hasEitherOperand(anyOf(binaryOperator(hasType(realFloatingPointType())), hasDescendant(binaryOperator(hasType(realFloatingPointType()))))))

  - id: narrowing_static_cast
    construct: Narrowing `static_cast`
    area: arithmetic
    canonical: Allowed if explicit
    decision: allow
    why: The prover proves the value fits.
    stage: prover

  # --------------------------------------------------------------- memory
  - id: raw_pointer
    construct: Non-owning raw pointer to one object
    area: memory
    canonical: Core Guidelines allow as observer
    decision: restrict
    limit: A parameter only. One object, no ownership, no arithmetic. No pointer member and no pointer local.
    why: Nullability goes in the contract. A stored pointer can outlive its object, and the model has no object that dies.
    use_instead: "a reference, or a value."
    stage: gate
    detect:
      - matcher: fieldDecl(hasType(pointerType(unless(pointee(functionType())))), unless(isImplicit()))
      - matcher: varDecl(hasType(pointerType(unless(pointee(functionType())))), unless(parmVarDecl()), unless(isImplicit()))

  - id: pointer_arithmetic
    construct: Pointer arithmetic, array-to-pointer decay
    area: memory
    canonical: Core Guidelines bounds profile ban
    decision: ban
    why: Pointer arithmetic has no bounds the prover can see.
    use_instead: std::span.
    stage: gate
    detect:
      - check: cppcoreguidelines-pro-bounds-pointer-arithmetic
      - check: cppcoreguidelines-pro-bounds-array-to-pointer-decay

  - id: raw_allocation
    construct: "`new` / `delete`, `malloc` / `free`"
    area: memory
    canonical: MISRA advisory ban
    decision: trusted_only
    why: Allocation is trusted. Ownership goes through RAII types.
    use_instead: std::unique_ptr or a container, or mark the function trusted with a reason.
    stage: gate
    detect:
      - check: cppcoreguidelines-owning-memory
      - check: cppcoreguidelines-no-malloc

  - id: raw_memory_ops
    construct: "`memcpy`, `memset`, `memmove` on anything but plain bytes"
    area: memory
    canonical: Core Guidelines discourage
    decision: trusted_only
    why: Bypasses the type model. UB on non-trivial types.
    use_instead: std::copy, assignment, or std::bit_cast, or mark the function trusted with a reason.
    stage: gate
    detect:
      - matcher: callExpr(callee(functionDecl(hasAnyName("memcpy", "memset", "memmove", "::std::memcpy", "::std::memset", "::std::memmove", "__builtin_memcpy", "__builtin_memset", "__builtin_memmove"))), unless(hasArgument(0, anyOf(hasType(pointsTo(anyOf(isAnyCharacter(), hasDeclaration(enumDecl(hasName("::std::byte")))))), hasType(arrayType(hasElementType(anyOf(isAnyCharacter(), hasDeclaration(enumDecl(hasName("::std::byte")))))))))))

  - id: launder_placement_new
    construct: "`std::launder`, placement `new`"
    area: memory
    canonical: Rare in application code
    decision: trusted_only
    why: Object-lifetime games the prover cannot follow.
    use_instead: std::optional or a container, or mark the function trusted with a reason.
    stage: gate
    detect:
      - matcher: callExpr(callee(functionDecl(hasName("::std::launder"))))
      - matcher: cxxNewExpr(hasAnyPlacementArg(anything()))

  - id: unique_ptr
    construct: "`std::unique_ptr`"
    area: memory
    canonical: Recommended
    decision: allow
    why: Trusted contract. Simple single ownership.
    stage: spec

  - id: shared_ptr
    construct: "`std::shared_ptr`"
    area: memory
    canonical: Allowed
    decision: trusted_only
    why: Shared ownership and refcounts are hard to reason about.
    use_instead: std::unique_ptr with one clear owner, or mark the function trusted with a reason.
    stage: gate
    detect:
      - matcher: typeLoc(loc(qualType(hasDeclaration(cxxRecordDecl(hasName("::std::shared_ptr"))))))
      - matcher: callExpr(callee(functionDecl(hasName("::std::make_shared"))))

  - id: lvalue_references
    construct: Lvalue references
    area: memory
    canonical: Allowed
    decision: allow
    why: The prover models them as pointers.
    stage: prover

  - id: rvalue_references
    construct: Rvalue refs and `std::move`
    area: memory
    canonical: Allowed
    decision: restrict
    limit: Move locals and parameters only, no use after move.
    why: Prover support to check in the first slice.
    use_instead: a move of a local or parameter, and no read of the moved-from object.
    stage: gate
    detect:
      - check: bugprone-use-after-move

  - id: return_ref_to_local
    construct: Returning a reference or pointer to a local
    area: memory
    canonical: MISRA mandatory ban
    decision: ban
    why: Always a bug.
    use_instead: a return by value.
    stage: gate
    detect:
      - check: clang-diagnostic-return-stack-address

  # -------------------------------------------------------------- library
  - id: array_span
    construct: "`std::array`, `std::span`"
    area: library
    canonical: Recommended
    decision: restrict
    limit: A span as a parameter only, never stored in a local or a member.
    why: Core trusted types.
    use_instead: "a span parameter, or the container itself."
    stage: gate
    detect:
      - matcher: varDecl(unless(parmVarDecl()), hasType(hasCanonicalType(hasDeclaration(cxxRecordDecl(hasName("::std::span"))))))
      - matcher: fieldDecl(hasType(hasCanonicalType(hasDeclaration(cxxRecordDecl(hasName("::std::span"))))))

  - id: containers
    construct: "`std::vector`, `std::string`, maps"
    area: library
    canonical: Allowed
    decision: restrict
    limit: Only methods that have a trusted contract. No reference into a container. No iterator held across a mutation. No operator[] on a map. No pointer into a container, by address-of, data(), c_str(), std::data, std::to_address or std::addressof.
    why: Trusted contracts carry the invalidation rules. A reference into a container dies at the next mutation, and the model has only values.
    use_instead: "a copy of the element. For a map, find, at or contains."
    stage: gate
    detect:
      - matcher: 'varDecl(hasType(referenceType()), unless(parmVarDecl()), unless(hasParent(declStmt(hasParent(cxxForRangeStmt())))), hasInitializer(hasDescendant(declRefExpr(to(varDecl(hasType(anyOf(hasCanonicalType(hasDeclaration(cxxRecordDecl(hasAncestor(namespaceDecl(hasName("std")))))), references(qualType(hasCanonicalType(hasDeclaration(cxxRecordDecl(hasAncestor(namespaceDecl(hasName("std"))))))))))))))), unless(hasType(references(qualType(hasCanonicalType(hasDeclaration(cxxRecordDecl(hasAncestor(namespaceDecl(hasName("std")))))))))))'
      - matcher: 'cxxOperatorCallExpr(hasOverloadedOperatorName("[]"), hasArgument(0, hasType(hasCanonicalType(hasDeclaration(cxxRecordDecl(hasAnyName("::std::map", "::std::unordered_map")))))))'
      - matcher: 'unaryOperator(hasOperatorName("&"), hasUnaryOperand(ignoringParenImpCasts(anyOf(cxxOperatorCallExpr(hasOverloadedOperatorName("[]"), hasArgument(0, hasType(hasCanonicalType(hasDeclaration(cxxRecordDecl(hasAncestor(namespaceDecl(hasName("std"))))))))), cxxMemberCallExpr(on(hasType(hasCanonicalType(hasDeclaration(cxxRecordDecl(hasAncestor(namespaceDecl(hasName("std")))))))), callee(cxxMethodDecl(hasAnyName("front", "back", "at", "data"))))))))'
      - matcher: 'cxxMemberCallExpr(on(hasType(hasCanonicalType(hasDeclaration(cxxRecordDecl(hasAncestor(namespaceDecl(hasName("std")))))))), callee(cxxMethodDecl(hasAnyName("data", "c_str"))))'
      - matcher: callExpr(callee(functionDecl(hasAnyName("::std::data", "::std::to_address"))))
      - matcher: declRefExpr(to(varDecl(hasAnyName("::std::ranges::data", "::std::ranges::cdata"))))
      - matcher: 'callExpr(callee(functionDecl(hasName("::std::addressof"))), hasArgument(0, ignoringParenImpCasts(anyOf(cxxOperatorCallExpr(hasOverloadedOperatorName("[]"), hasArgument(0, hasType(hasCanonicalType(hasDeclaration(cxxRecordDecl(hasAncestor(namespaceDecl(hasName("std"))))))))), cxxMemberCallExpr(on(hasType(hasCanonicalType(hasDeclaration(cxxRecordDecl(hasAncestor(namespaceDecl(hasName("std")))))))), callee(cxxMethodDecl(hasAnyName("front", "back", "at"))))))))'

  - id: variable_index
    construct: "`operator[]` with a variable index"
    area: library
    canonical: Core Guidelines bounds profile ban
    decision: allow
    why: The prover proves the index is in range.
    use_instead: a constant index, or a range-for loop.
    stage: prover
    detect:
      - check: cppcoreguidelines-pro-bounds-constant-array-index

  - id: accumulate_init
    construct: Fold with an init value narrower than the elements
    area: library
    canonical: "Core Guidelines ES.102"
    decision: ban
    why: The fold runs in the type of the init value, so a sum of int64_t values in an int wraps.
    use_instead: "an init value of the element type, such as int64_t{0}."
    stage: gate
    detect:
      - check: bugprone-fold-init-type

  - id: iterators
    construct: Iterators
    area: library
    canonical: Allowed
    decision: restrict
    limit: "Range-for only. The loop body does not change the range, by a call on it or through a function. begin and end may appear only as direct arguments of a std:: call. No stored iterator, no std::next, prev, advance or distance."
    why: Iterator arithmetic is pointer arithmetic in disguise.
    use_instead: a range-for loop, or an index the prover can check.
    stage: gate
    detect:
      - check: cplusp-iterator-arithmetic
      - matcher: 'cxxForRangeStmt(hasRangeInit(declRefExpr(to(varDecl().bind("range")))), hasBody(hasDescendant(anyOf(cxxMemberCallExpr(on(declRefExpr(to(varDecl(equalsBoundNode("range"))))), callee(cxxMethodDecl(unless(isConst())))), callExpr(callee(functionDecl(hasAnyParameter(hasType(references(qualType(unless(isConstQualified()))))))), hasAnyArgument(ignoringParenImpCasts(declRefExpr(to(varDecl(equalsBoundNode("range")))))))))))'

  - id: optional_expected_variant
    construct: "`std::optional`, `std::expected`, `std::variant`"
    area: library
    canonical: Recommended
    decision: allow
    why: Trusted contracts. Replaces unions and exceptions.
    stage: spec

  - id: algorithms
    construct: "`<algorithm>` with lambdas"
    area: library
    canonical: Allowed
    decision: restrict
    limit: Only algorithms on the trusted list, which is short at first.
    why: Each algorithm needs a trusted contract.
    stage: spec

  # ---------------------------------------------------------------- casts
  - id: c_style_casts
    construct: C-style casts
    area: casts
    canonical: Banned by MISRA and Core Guidelines
    decision: ban
    why: Hides what kind of cast it is. All forms, including plain numeric narrowing.
    use_instead: static_cast, or std::bit_cast for a byte view.
    stage: gate
    detect:
      - check: google-readability-casting

  - id: reinterpret_const_cast
    construct: "`reinterpret_cast`, `const_cast`"
    area: casts
    canonical: Banned
    decision: trusted_only
    why: Defeats the type model. Most forms are UB.
    use_instead: std::bit_cast, or mark the function trusted with a reason.
    stage: gate
    detect:
      - check: cppcoreguidelines-pro-type-reinterpret-cast
      - check: cppcoreguidelines-pro-type-const-cast

  - id: downcasts
    construct: Downcasts (`static_cast`, `dynamic_cast`)
    area: casts
    canonical: Core Guidelines ban `static_cast` downcasts
    decision: ban
    why: A downcast asserts a type the prover cannot see. Every dynamic_cast counts, including a cross-cast.
    use_instead: virtual dispatch.
    stage: gate
    detect:
      - check: cppcoreguidelines-pro-type-static-cast-downcast
      - matcher: cxxDynamicCastExpr()

  # -------------------------------------------------------------- classes
  - id: classes_raii
    construct: Classes, constructors, destructors, RAII
    area: classes
    canonical: Allowed
    decision: allow
    why: Core of the subset.
    stage: prover

  - id: single_inheritance
    construct: Single inheritance, `virtual`, `override`, `final`
    area: classes
    canonical: eCv++ requires `override`, encourages `final`
    decision: allow
    why: The prover checks overrides for Liskov substitution.
    stage: prover

  - id: member_init_order
    construct: Mem-initializers out of declaration order
    area: classes
    canonical: "Core Guidelines C.47, -Wreorder"
    decision: ban
    why: C++ initializes the members in declaration order, whatever order the constructor writes. A member read before its turn is undefined.
    use_instead: "the mem-initializers in declaration order."
    stage: gate
    detect:
      - check: clang-diagnostic-reorder-ctor

  - id: slicing
    construct: Copy of a derived object into a base type
    area: classes
    canonical: "Core Guidelines ES.63 and C.145"
    decision: ban
    why: The copy keeps the base part only, and a virtual call on it goes to the base.
    use_instead: "a reference, or a unique_ptr to the base."
    stage: gate
    detect:
      - check: cppcoreguidelines-slicing

  - id: virtual_call_in_constructor
    construct: Virtual call in a constructor or destructor
    area: classes
    canonical: "Core Guidelines C.82"
    decision: ban
    why: The call goes to the class under construction, not to the derived class.
    use_instead: "a call after construction, or a non-virtual function."
    stage: gate
    detect:
      - check: clang-analyzer-optin.cplusplus.VirtualCall

  - id: virtual_destructor
    construct: Class with a virtual function and no virtual destructor
    area: classes
    canonical: "Core Guidelines C.35"
    decision: ban
    why: Deleting a derived object through a base pointer is undefined without one.
    use_instead: "a virtual destructor, virtual ~Base() = default."
    stage: gate
    detect:
      - check: cppcoreguidelines-virtual-class-destructor

  - id: missing_override
    construct: Overriding without `override`
    area: classes
    canonical: eCv++ requires `override`
    decision: ban
    why: An override the reader cannot see is a hidden contract change.
    use_instead: the override keyword.
    stage: gate
    detect:
      - check: modernize-use-override

  - id: multiple_inheritance
    construct: Multiple inheritance
    area: classes
    canonical: "eCv++: interfaces only"
    decision: restrict
    limit: At most one base with data or non-pure functions. Every other base is a pure interface, with only pure virtual functions and a virtual destructor.
    why: Keep the object model simple.
    use_instead: one concrete base plus interfaces.
    stage: gate
    detect:
      - check: cplusp-multiple-inheritance

  - id: virtual_inheritance
    construct: Virtual inheritance
    area: classes
    canonical: MISRA advisory ban
    decision: ban
    why: Not provable today.
    use_instead: composition.
    stage: gate
    detect:
      - matcher: cxxRecordDecl(hasAnyBase(isVirtual()))

  - id: operator_overloading
    construct: Operator overloading
    area: classes
    canonical: "eCv++: const, no side effects"
    decision: restrict
    limit: A const member, or a free function with const or by-value parameters. No assignment, compound assignment, increment or decrement operator unless it is `= default` or `= delete`.
    why: Hidden side effects confuse contracts.
    use_instead: a const operator with no side effects, or a named function.
    stage: gate
    detect:
      - check: cplusp-impure-operator

  - id: implicit_conversions
    construct: Implicit conversions (non-`explicit` ctors, conversion operators)
    area: classes
    canonical: eCv++ requires `explicit`
    decision: ban
    why: Hidden calls confuse contracts.
    use_instead: explicit on the constructor or conversion operator.
    stage: gate
    detect:
      - check: google-explicit-constructor
      - matcher: cxxConversionDecl(unless(isExplicit()), unless(isImplicit()))

  - id: mutable_members
    construct: "`mutable` members"
    area: classes
    canonical: eCv++ ban
    decision: ban
    why: Breaks const reasoning.
    use_instead: a non-const member function, or a separate cache object.
    stage: gate
    detect:
      - check: cplusp-mutable

  # ------------------------------------------------------------ templates
  - id: templates
    construct: Function and class templates
    area: templates
    canonical: "eCv++: type params only, no specialisation"
    decision: restrict
    limit: Type parameters only, no specialisation.
    why: Verified per instantiation.
    use_instead: a template with type parameters only.
    stage: gate
    detect:
      - matcher: classTemplateSpecializationDecl(isExplicitTemplateSpecialization())
      - matcher: classTemplatePartialSpecializationDecl()
      - matcher: functionDecl(isExplicitTemplateSpecialization())
      - matcher: varDecl(isExplicitTemplateSpecialization())
      - matcher: nonTypeTemplateParmDecl()
      - matcher: templateTemplateParmDecl()

  - id: constexpr
    construct: "`constexpr`, `consteval`, concepts"
    area: templates
    canonical: Allowed
    decision: allow
    why: Compile-time only.
    stage: none

  - id: metaprogramming
    construct: SFINAE, template metaprogramming
    area: templates
    canonical: Discouraged
    decision: trusted_only
    why: Nothing to prove at runtime, but unreadable contracts.
    use_instead: concepts and plain overloads, or mark the function trusted with a reason.
    stage: gate
    detect:
      - matcher: typeLoc(loc(templateSpecializationType(hasDeclaration(namedDecl(hasAnyName("::std::enable_if", "::std::enable_if_t", "::std::void_t", "::std::conditional", "::std::conditional_t"))))))

  # -------------------------------------------------------------- control
  - id: control_flow
    construct: "`if`, `switch`, `for`, `while`, early `return`"
    area: control
    canonical: Allowed by all
    decision: allow
    why: The prover follows them.
    stage: prover

  - id: switch_fallthrough
    construct: Fall-through between switch cases
    area: control
    canonical: "MISRA 16.3, -Wimplicit-fallthrough"
    decision: ban
    why: Control runs into the next case with no sign in the source, and a match in the model has no fall-through.
    use_instead: "a break or a return in every case, or [[fallthrough]] when it is meant."
    stage: gate
    detect:
      - check: clang-diagnostic-implicit-fallthrough

  - id: switch_missing_case
    construct: Switch that does not cover every value
    area: control
    canonical: "MISRA 16.4 and 16.5"
    decision: ban
    why: A value with no case runs past the switch in silence, and the match in the model must cover every value.
    use_instead: "a case for every enumerator, or a default."
    stage: gate
    detect:
      - check: clang-diagnostic-switch
      - check: bugprone-switch-missing-default-case

  - id: exceptions
    construct: Exceptions
    area: control
    canonical: eCv++ ban. Common in safety code
    decision: ban
    why: Verified code is noexcept.
    use_instead: std::expected.
    stage: gate
    detect:
      - matcher: cxxThrowExpr()
      - matcher: cxxTryStmt()

  - id: goto
    construct: "`goto`"
    area: control
    canonical: MISRA ban
    decision: ban
    why: No benefit.
    use_instead: a loop.
    stage: gate
    detect:
      - check: cppcoreguidelines-avoid-goto

  - id: unreachable_assume
    construct: "`[[assume]]`, `__builtin_unreachable`, `std::unreachable`"
    area: control
    canonical: New in C++23
    decision: ban
    why: UB if the claim is false. Claims belong in the contract, where the prover checks them. The C++23 `[[assume]]` attribute is not caught yet.
    use_instead: a precondition or an assertion in the contract.
    stage: gate
    detect:
      - matcher: callExpr(callee(functionDecl(hasAnyName("__builtin_unreachable", "::std::unreachable", "__builtin_assume"))))

  - id: longjmp
    construct: "`setjmp` / `longjmp`"
    area: control
    canonical: MISRA ban
    decision: ban
    why: Skips destructors. UB in C++.
    use_instead: return values or std::expected.
    stage: gate
    detect:
      - matcher: callExpr(callee(functionDecl(hasAnyName("longjmp", "_longjmp", "siglongjmp", "setjmp", "_setjmp", "__sigsetjmp", "sigsetjmp"))))

  - id: recursion
    construct: Recursion
    area: control
    canonical: MISRA ban
    decision: restrict
    limit: Needs a `decreases` clause in the contract.
    why: The prover needs a termination measure. Loops are easier.
    use_instead: a loop, or a decreases clause.
    stage: gate
    detect:
      - check: cplusp-recursion

  - id: evaluation_order
    construct: Two changes of state in one expression
    area: control
    canonical: "MISRA 13.2. Core Guidelines ES.43 and ES.44"
    decision: restrict
    limit: At most one change of state in one full expression. A call outside `std` may change state when a parameter is a non-const reference or pointer, or when it is a non-const member function.
    why: C++ does not fix the order of two calls in one expression, and compilers differ. Two increments of one variable in one expression are undefined.
    use_instead: one statement per call, in the order the contract needs.
    stage: gate
    detect:
      - check: clang-diagnostic-unsequenced
      - matcher: 'callExpr(callExpr(unless(callee(functionDecl(hasAncestor(namespaceDecl(hasName("std")))))), anyOf(callee(functionDecl(hasAnyParameter(hasType(qualType(anyOf(references(qualType(unless(isConstQualified()))), pointsTo(qualType(unless(isConstQualified()))))))))), allOf(cxxMemberCallExpr(), unless(cxxOperatorCallExpr()), callee(cxxMethodDecl(unless(isConst())))))), expr().bind("self"), hasAncestor(expr(hasDescendant(callExpr(callExpr(unless(callee(functionDecl(hasAncestor(namespaceDecl(hasName("std")))))), anyOf(callee(functionDecl(hasAnyParameter(hasType(qualType(anyOf(references(qualType(unless(isConstQualified()))), pointsTo(qualType(unless(isConstQualified()))))))))), allOf(cxxMemberCallExpr(), unless(cxxOperatorCallExpr()), callee(cxxMethodDecl(unless(isConst())))))), unless(equalsBoundNode("self")), unless(hasAncestor(expr(equalsBoundNode("self")))), unless(hasDescendant(expr(equalsBoundNode("self")))))))))'

  - id: lambdas
    construct: Lambdas
    area: control
    canonical: Allowed
    decision: restrict
    limit: "Passed directly to a std:: call, capturing by value only. No capture by reference, no capture of this, and not mutable."
    why: Captured references can dangle.
    use_instead: a lambda passed straight to the algorithm, capturing by value.
    stage: gate
    detect:
      - check: cplusp-lambda-limits

  - id: function_pointers
    construct: Function pointers, `std::function`
    area: control
    canonical: eCv++ allows with contracts
    decision: trusted_only
    why: Indirect calls need contracts on the target.
    use_instead: direct calls or a template parameter, or mark the function trusted with a reason.
    stage: gate
    detect:
      - matcher: typeLoc(loc(qualType(anyOf(hasCanonicalType(pointerType(pointee(functionType()))), hasCanonicalType(memberPointerType(pointee(functionType())))))), unless(hasAncestor(decl(isImplicit()))))
      - matcher: typeLoc(loc(qualType(hasDeclaration(cxxRecordDecl(hasName("::std::function"))))))

  - id: varargs_coroutines
    construct: Varargs, coroutines
    area: control
    canonical: Banned by Core Guidelines (varargs)
    decision: ban
    why: Not provable.
    use_instead: std::span of arguments, or a plain loop.
    stage: gate
    detect:
      - check: cppcoreguidelines-pro-type-vararg
      - matcher: coawaitExpr()
      - matcher: coyieldExpr()
      - matcher: coreturnStmt()

  # ---------------------------------------------------------- concurrency
  - id: concurrency
    construct: Threads, atomics, mutexes
    area: concurrency
    canonical: Allowed in MISRA
    decision: trusted_only
    why: Concurrent proofs are far harder. Isolate them.
    use_instead: a trusted function that owns the lock or the atomic, with a contract.
    stage: gate
    detect:
      - matcher: typeLoc(loc(qualType(hasDeclaration(cxxRecordDecl(hasAnyName("::std::thread", "::std::jthread", "::std::mutex", "::std::recursive_mutex", "::std::shared_mutex", "::std::timed_mutex", "::std::atomic", "::std::atomic_flag", "::std::condition_variable", "::std::lock_guard", "::std::unique_lock", "::std::scoped_lock", "::std::future", "::std::promise"))))))
      - matcher: callExpr(callee(functionDecl(hasAnyName("::std::async", "::std::atomic_load", "::std::atomic_store", "::std::atomic_exchange", "::std::atomic_fetch_add"))))

  - id: shared_variables
    construct: Variables other threads may change
    area: concurrency
    canonical: Allowed in MISRA with care
    decision: restrict
    limit: Through a parameter or a trusted getter, never a direct read or write.
    why: Each read may see a different value. See State in the plan.
    stage: spec

  - id: volatile
    construct: "`volatile`"
    area: concurrency
    canonical: MISRA restricts
    decision: trusted_only
    why: Hardware access only. A volatile qualifier on a member function is not caught yet.
    use_instead: a trusted accessor with a contract.
    stage: gate
    detect:
      - matcher: typeLoc(loc(qualType(isVolatileQualified())))

  # ---------------------------------------------------------------- state
  - id: global_constructors
    construct: Global with a dynamic initializer
    area: state
    canonical: "Core Guidelines I.22, -Wglobal-constructors"
    decision: ban
    why: Globals in different files initialize in an order the standard leaves open, so one may read another before it exists.
    use_instead: "constexpr or constinit, or a function that computes the value on demand."
    stage: gate
    detect:
      - check: clang-diagnostic-global-constructors

  - id: global_state
    construct: Globals, statics, static members, function-local statics
    area: state
    canonical: MISRA restricts globals
    decision: restrict
    limit: Listed in the contract's reads or modifies clause. Constants exempt.
    why: Hidden state breaks modular proofs. Treated as inputs and outputs, see State in the plan.
    use_instead: a reads or modifies clause naming the variable, or a parameter.
    stage: gate
    detect:
      - check: cplusp-unlisted-state

  # ------------------------------------------------------------- platform
  - id: inline_asm_intrinsics
    construct: Inline asm, SIMD intrinsics
    area: platform
    canonical: MISRA restricts asm
    decision: trusted_only
    why: Hot-path code goes behind a contract.
    use_instead: plain C++, or mark the function trusted with a reason.
    stage: gate
    detect:
      - check: hicpp-no-assembler
      - matcher: callExpr(callee(functionDecl(matchesName("^::(_mm|_mm256|_mm512|__builtin_ia32|__builtin_neon|__builtin_arm)_"))))

  - id: function_like_macros
    construct: Function-like macros
    area: platform
    canonical: MISRA advisory ban
    decision: ban
    why: Hides code from the prover.
    use_instead: a constexpr function or a template.
    stage: gate
    detect:
      - check: cppcoreguidelines-macro-usage
