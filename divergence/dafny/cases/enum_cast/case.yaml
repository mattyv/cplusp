construct: "static_cast of an integer to an enum class"
standard: "[dcl.enum]: for an enumeration with a fixed underlying type, the values of the enumeration are the values of the underlying type. static_cast<Mode>(7) is a valid value with no enumerator."
row: enum_cast
gap: 3
cpp: "`static_cast<Mode>(7)` is a valid value of `Mode` when the underlying type is fixed. It is none of the enumerators."
naive_does: "It models `Mode` as a datatype of its enumerators, and the cast as a match with a case for 0 and for 1. Dafny does not accept a match that misses a value."
naive: fails
mitigated: verifies
side: gate
gate_rule: enum_cast
mitigation: "Gate row `enum_cast` bans the cast, also in trusted code, decision 0114. The C++ maps the number to an enumerator with an `if` or a `switch`. The model is that map, with no precondition."
witness:
  fixed_prints: "1"
  input: "7"
  ubsan: false
  prints: "7"
rule: |
  Model an `enum class` as a datatype of its enumerators.
  The gate bans each cast to an `enum class` whose enumerators have no values written, also in trusted code, row `enum_cast`, decision 0114. To make one from a number, switch on the number and return an enumerator for each case.
  A flags type, where `|` makes values no enumerator names, is a `bv32` in the model, and a cast to it needs no enumerator precondition.
