construct: "Subscript of a std::array"
standard: "[sequence.reqmts]: a[n] is *(a.begin() + n), and [iterator.requirements.general] says a past-the-end iterator is not dereferenceable."
row: array_span
gap: 3
cpp: "`a[i]` with `i` equal to the size reads past the array. Nothing checks the index."
naive_does: "Dafny asks for a proof that `i < 4`. There is none. That is the right answer, so the model is stricter than C++."
naive: fails
mitigated: verifies
side: contract
mitigation: "A precondition `i < 4` in the contract, `requires i < 4` in the C++ and in the model. The caller proves it."
witness:
  input: "a[4] on an array of 4"
  ubsan: false
  asan: true
rule: |
  Model `std::array<T, N>` as a `seq<T>` with `|a| == N`.
  Every subscript needs `requires i < N` in the contract, as for a plain array.
