construct: "Product of two doubles that underflows"
standard: "[basic.fundamental]: the value representation of a floating-point type is implementation-defined."
row: floating_point
gap: 1
cpp: "On this target, IEEE 754 binary64, a product below 2^-1075, half the smallest subnormal, rounds to 0. `scaled(1e-200, 1e-200)` is 0, not 1e-400."
naive_does: "The model multiplies reals, and the product is exact. The proof of `result == a * b` goes through, and the model says `scaled(1e-200, 1e-200)` is 1e-400."
naive: verifies
naive_is_wrong: true
mitigated: verifies
side: model
mitigation: "The product is `fmul`, and the contract is the bound `abs(result - a * b) <= EPS * abs(a * b) + ETA`. The `ETA` term lets the result be 0. The C++ contract states `|a * b| <= DBL_MAX` and no lower bound."
witness:
  input: "scaled(1e-200, 1e-200)"
  ubsan: false
  prints: "0"
rule: |
  A product or quotient can fall below the smallest subnormal and round to 0.
  The `eta` term of the bound is what allows it.
  State `|a * b| <= DBL_MAX` in the C++ contract, and never a lower bound.
