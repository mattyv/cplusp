construct: "Unsigned subtraction on uint32_t"
standard: "[basic.fundamental]: arithmetic for the unsigned type is performed modulo 2^N."
row: arithmetic
gap: 3
cpp: "Unsigned arithmetic wraps modulo 2^32, and it is defined. `1 - 2` is 4294967295."
naive_does: "Dafny does not wrap, so `a - b` is a range error when `a < b`. The model refuses code that is fine in C++."
naive: fails
mitigated: verifies
side: model
mitigation: "A `wrap32` helper in the model, used where the contract says the wrap is meant. Otherwise a precondition `b <= a`."
witness:
  input: "1 - 2"
  ubsan: false
  prints: "4294967295"
rule: |
  Map `uint32_t` to `newtype uint32 = x: int | 0 <= x < 0x1_0000_0000`.
  Unsigned arithmetic wraps in C++ and does not wrap in Dafny.
  Where the C++ means to wrap, write `wrap32((a as int) - (b as int))` with the helper `wrap32(x: int) = (x % 0x1_0000_0000) as uint32`.
  Dafny `%` is never negative, so this is the C++ result.
  Where the C++ does not mean to wrap, add a precondition such as `requires b <= a`.
