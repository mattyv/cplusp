construct: "Equality of two doubles"
standard: "[expr.eq]: for floating-point operands, == compares the values. IEEE 754 makes a NaN unordered, so NaN == NaN is false."
row: floating_point
gap: 3
cpp: "`a == b` is false when an operand is a NaN, and a NaN is not equal to itself. `same(nan, nan)` is false."
naive_does: "The model has no NaN, and `a == b` is the equality of reals. The proof goes through for every value the model has."
naive: verifies
naive_is_wrong: true
mitigated: verifies
side: gate
gate_rule: float_equality
mitigation: "Gate row `float_equality`: no `==` or `!=` on floats. The C++ requires finite values and compares with `a <= b && b <= a`, and the model is exact."
witness:
  fixed_prints: "0 1"
  input: "same(nan, nan) and same(1.0, 1.0)"
  ubsan: false
  prints: "0 1"
rule: |
  The model has no NaN and no infinity.
  Every float parameter requires `std::isfinite` in the C++ contract.
  Never compare floats with `==`.
  The gate refuses it.
