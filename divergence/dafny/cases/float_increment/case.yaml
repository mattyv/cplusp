construct: "Adding 1.0 to a double above 2^53"
standard: "[basic.fundamental]: the value representation of a floating-point type is implementation-defined."
row: floating_point
gap: 1
cpp: "On this target, IEEE 754 binary64, the doubles above 2^53 are 2 apart. At 2^53 the sum is a tie and rounds to even, so it is x. Above 2^53 the sum is x or x + 2, never x + 1."
naive_does: "The model adds exactly, so `result == x + 1.0` for every x. The proof goes through, and a loop that adds 1.0 counts."
naive: verifies
naive_is_wrong: true
mitigated: verifies
side: model
mitigation: "The sum is `fadd`, and the contract is the bound `abs(result - (x + 1.0)) <= EPS * abs(x + 1.0) + ETA`. The model can neither prove nor refute the equality. Exact counting needs an integer type in the C++."
witness:
  input: "next(2^53) == 2^53"
  ubsan: false
  prints: "1"
rule: |
  A bound of `EPS * abs(x)` is 1.0 at 2^53, so above it the model promises nothing about the last digit.
  When the C++ needs exact counting, use an integer type.
