construct: "A function-local static variable"
standard: "[basic.stc.static]: the storage for these entities lasts for the duration of the program."
row: global_state
gap: 3
cpp: "`n` has static storage duration, so it is one object for the whole program, and it keeps its value between calls. The first call returns 1, and the second call returns 2."
naive_does: "The model makes `n` a local variable that is 0 on every call, so every call returns 1. The proof of `result == 1` goes through."
naive: verifies
naive_is_wrong: true
mitigated: verifies
side: gate
gate_rule: static_local
mitigation: "Gate row `static_local`: no function-local static, because no caller can list it. The C++ keeps the count in a static data member, `Tally::n`, listed in `modifies`. In the model it is a field of the State value the function takes in and gives back."
witness:
  input: "two calls of counter()"
  ubsan: false
  prints: "1 2"
  fixed_prints: "1 2"
rule: |
  A function-local static is a global with a name no caller's contract can list. The gate refuses it.
  Use a static data member or a global, and list it in `modifies` or `reads`.
  Model it as a field of the State value that the function takes in and gives back.
  Never model it as a local.
