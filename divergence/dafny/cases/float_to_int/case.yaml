construct: "Conversion of a double to int32_t"
standard: "[conv.fpint]: the conversion truncates toward zero, and the behavior is undefined if the truncated value cannot be represented in the destination type."
row: floating_point
gap: 3
cpp: "`static_cast<int32_t>(x)` truncates toward zero. When the truncated value does not fit, the behaviour is undefined. `whole(3e10)` is undefined."
naive_does: "The model converts with `Floor`, and Dafny fails the range check, so the model is stricter than the C++. `Floor` is also the wrong function for a negative value: Floor(-3.7) is -4, and truncation gives -3."
naive: fails
mitigated: verifies
side: contract
mitigation: "`trunc` rounds toward zero. The contract requires `-2147483649.0 < x < 2147483648.0`, in the C++ and in the model."
witness:
  input: "whole(3e10)"
  ubsan: true
rule: |
  Model `static_cast<int32_t>(x)` as truncation toward zero, not `Floor`.
  Write `trunc(x)` as `if x >= 0.0 then x.Floor else -((-x).Floor)`.
  The contract requires the value to fit: `requires -2147483649.0 < x < 2147483648.0`.
