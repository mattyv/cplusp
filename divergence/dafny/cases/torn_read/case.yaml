construct: "Two reads of a variable another thread writes"
standard: "[intro.races]: two potentially concurrent conflicting actions, at least one of which is not atomic, and neither happens before the other. Any such data race results in undefined behavior."
row: shared_variables
gap: 3
cpp: "Another thread writes `shared` while `difference()` runs. The two reads can see two values, so `difference()` can be other than 0. The plain read and the plain write are a data race, which is undefined."
naive_does: "The model makes the getter a function of the state, so two reads are equal. `difference` proves `result == 0`."
naive: verifies
naive_is_wrong: true
mitigated: verifies
side: contract
mitigation: "The getter is trusted code that must read an atomic, which the gate cannot see yet. Its model is a method with `ensures` only a range, so two calls may differ. The contract of `difference` is a bound, `-999 <= result <= 999`, and not `result == 0`. The contract covers the verified side only."
witness:
  input: "one write in a second thread with no ordering against one read, which the sanitizer sees, then a writer loop while the main thread calls difference() a million times"
  ubsan: false
  tsan: true
  prints: "1"
rule: |
  A variable another thread may change has no value, only a fresh read each time.
  Model its getter as a method that does not constrain its result between calls.
  The contract of the getter says only what every writer keeps, for example a range.
  The getter is trusted code, and it must read an atomic. A plain read of a variable another thread writes is a data race.
  Never prove two reads equal.
