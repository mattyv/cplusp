construct: "Two reference parameters"
standard: "[dcl.ref]: a reference can be thought of as a name of an object, and nothing forbids two parameters that name one object."
row: lvalue_references
gap: 3
cpp: "Two references may name the same object. `add_both(x, x)` with x = 3 leaves x = 12."
naive_does: "Each reference is a separate in value and out value, so the model says 6 and 9 for `add_both(x, x)`."
naive: verifies
naive_is_wrong: true
mitigated: verifies
side: model
mitigation: "A non-const reference is a value in and a value out. The model cannot see two names for one object, so the C++ contract carries `requires &a != &b` for every pair of non-const references, and the caller proves it."
witness:
  input: "add_both(x, x) with x = 3"
  ubsan: false
  prints: "12 6 9"
rule: |
  A non-const reference parameter is a value in and a value out of the model, decision 0029.
  A value model cannot see two names for one object.
  So two non-const reference parameters of one type, or a reference and `this`, always carry `requires &a != &b` in the C++ contract.
  Callers must then prove that the two are different.
  A const reference is a value in.
