construct: "Two reference parameters"
standard: "[dcl.ref]: a reference can be thought of as a name of an object, and nothing forbids two parameters that name one object."
row: lvalue_references
gap: 3
cpp: "Two references may name the same object. `add_both(x, x)` with x = 3 leaves x = 12."
naive_does: "Each reference is a separate in value and out value, so the model says 6 and 9 for `add_both(x, x)`."
naive: verifies
naive_is_wrong: true
mitigated: verifies
side: gate
gate_rule: aliasing
mitigation: "Gate row `aliasing`, decision 0033: in a call where one argument can write, every reference argument reaches a different object. The call `add_both(x, x)` is refused at its line. The C++ passes two objects, and the value model is exact for that call."
witness:
  input: "demo(), which calls add_both(x, x) with x = 3, then add_both(a, b) with 3 and 4"
  ubsan: false
  prints: "12"
  fixed_prints: "7 11"
rule: |
  A non-const reference parameter is a value in and a value out of the model, decision 0029.
  A value model cannot see two names for one object.
  So the gate refuses a call in which two reference arguments reach one object and one of them can write, row `aliasing`, decision 0033.
  No contract carries a clause about addresses. A value has no address.
  A const reference is a value in.
