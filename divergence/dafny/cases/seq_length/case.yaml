construct: "The size of a vector as a size_t"
standard: "[container.reqmts]: a.size() returns a value of type size_type, the number of elements."
row: containers
gap: 3
cpp: "`v.size()` is the number of elements, and it always fits `size_t`. For `{4, 5, 6}` it is 3."
naive_does: "A Dafny `seq` has no bound on its length, so `|v| as uint64` may not fit. Dafny refuses code that is fine in C++."
naive: fails
mitigated: verifies
side: model
mitigation: "Each sequence parameter requires `|v| <= 0xFFFF_FFFF_FFFF_FFFF`. Every C++ sequence meets it, so no caller loses a valid call."
witness:
  input: "count({4, 5, 6})"
  ubsan: false
  prints: "3"
rule: |
  A Dafny `seq` has no bound on its length, and a C++ sequence has at most `SIZE_MAX` elements.
  To read `|v|` as a `uint64`, require `|v| <= 0xFFFF_FFFF_FFFF_FFFF` on each sequence parameter.
  Every C++ sequence meets that, so each caller can meet it.
