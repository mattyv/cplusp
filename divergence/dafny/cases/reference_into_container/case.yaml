construct: "A reference to a vector element across push_back"
standard: "[vector.modifiers]: when the new size is greater than the capacity, push_back invalidates every reference to an element, and [basic.life] makes a read through one undefined."
row: containers
gap: 3
cpp: "`push_back` on a vector at capacity moves the elements to new storage. The reference `r` then points into freed memory, and `return r` reads it."
naive_does: "A `seq` element is a value, so `v := v + [1]` cannot change `r`. The model proves `result == old(v[0])`."
naive: verifies
naive_is_wrong: true
mitigated: verifies
side: gate
gate_rule: containers
mitigation: "Gate row `containers`: no reference into a container. The C++ copies the element out, `int32_t r = v[0];`, and the model is exact."
witness:
  fixed_prints: "1"
  input: "a vector of one element, at capacity"
  ubsan: false
  asan: true
rule: |
  A `seq` element is a value, and a C++ reference into a container dies at the next mutation.
  Copy the element out.
  Never hold a reference into a container.
