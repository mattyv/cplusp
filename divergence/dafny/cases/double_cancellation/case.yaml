construct: "Subtraction after addition on doubles"
standard: "[basic.fundamental]: the value representation of a floating-point type is implementation-defined."
row: double_expression
gap: 1
cpp: "On this target, IEEE 754 round to nearest, a + b rounds to the nearest double. When a is below the unit round-off of b, the sum is b and `s - b` is 0. `shifted(1e-16, 1.0)` is 0, not 1e-16."
naive_does: "The model computes in exact reals, so `(a + b) - b == a` for every a and b. The proof goes through."
naive: verifies
naive_is_wrong: true
mitigated: verifies
side: model
mitigation: "Two roundings and a bound from the magnitudes of the operands, `abs(result - a) <= 4.0 * EPS * (abs(a) + abs(b)) + 3.0 * ETA`, with `|a| <= 1` and `|b| <= 1` in the contract."
witness:
  input: "shifted(1e-16, 1.0)"
  ubsan: false
  prints: "0"
rule: |
  Every operation rounds, and the errors add.
  State the bound from the magnitudes of the operands, not from the result the mathematics would give.
  Call `RoundError` once for each operation, on the exact value that the operation rounds.
  Each rounding adds `eta`, so a chain of roundings carries a small multiple of `eta` in its bound.
