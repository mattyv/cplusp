construct: "A trusted function that changes a global its contract does not list"
standard: "[basic.stc.static]: all variables which do not have thread storage duration and belong to a namespace scope have static storage duration. The storage for these entities lasts for the duration of the program."
row: global_state
gap: 5
cpp: "`total` is one object for the whole program. `add` changes it, and `delta` reads it before and after the call. The contract of `add` has no `modifies total`, so the bot believes `total` does not change. `delta()` returns 1, not 0."
naive_does: "The model of `add` is an axiom method with `ensures total == old(total) + x` and no `modifies`. Dafny then also assumes `total` unchanged, so the contract contradicts itself and the model proves anything. `delta` proves 0."
naive: verifies
naive_is_wrong: true
mitigated: verifies
side: gate
gate_rule: global_state
mitigation: "Gate row `global_state`, decision 0035: the gate reads the `modifies` and `reads` lines and refuses `total += x` in a function whose lines do not list `total`. The C++ contract of `add` gains `modifies total`, and `delta`, which changes `total` through `add`, lists it too. `add` takes the State in and gives it back, and `delta` proves `result == 1`."
witness:
  input: "delta()"
  ubsan: false
  prints: "1"
  fixed_prints: "1"
rule: |
  A global is a field of the State value.
  Every function that changes it takes the State in and gives it back. In the C++ contract that is `modifies total`.
  A trusted contract that omits it is false.
  The gate reads the `modifies` and `reads` lines, decision 0035, and refuses an access to a global they do not list, also through a call.
  A trusted function has a body the gate does not judge, so a reviewer still reads its lines.
